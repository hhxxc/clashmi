name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build Libclash core SDK
        run: bash scripts/build_libclash_core.sh

      # 补丁引擎单元测试（overwrite 语义 / extension 追加 / http_proxy 提取 /
      # 双补丁顺序 / 数字归一化等 11 个用例）
      - name: Run facade unit tests
        run: |
          mkdir -p /tmp/patchtest
          cp bind/libclash/patch.go bind/libclash/patch_test.go /tmp/patchtest/
          cd /tmp/patchtest
          go mod init patchtest
          go mod edit -replace go.yaml.in/yaml/v3="$GITHUB_WORKSPACE/.core-build/kernel/third_party/yaml-v3"
          go mod tidy
          go test -v ./...

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ldid
        run: brew install ldid

      # lib/generated/build_time.dart 由 build_runner 生成且被上游 gitignore，
      # 直接现场生成（内容只是一个构建时间戳常量）
      - name: Generate build_time.dart
        run: |
          mkdir -p lib/generated
          NOW=$(date +"%Y, %-m, %-d, %-H, %-M, %-S")
          printf '// GENERATED CODE - DO NOT MODIFY BY HAND\n// This file is generated during build process\n\n/// Build timestamp - automatically generated at build time\nfinal DateTime buildDateTime = DateTime(%s);\n' "$NOW" > lib/generated/build_time.dart
          cat lib/generated/build_time.dart

      # Dart 侧协议契约测试：VpnServiceConfig toJson/fromJson 全字段往返，
      # 锁死"toJson 漏字段导致设备端静默失效"这类 bug（Windows 本地装 Flutter 后同样可跑）
      - name: Run Dart protocol unit tests
        run: |
          cd third_party/libclash_vpn_service
          flutter pub get
          flutter test -r expanded

      # 模拟器真实启动自测：装 app → 启动 → 截图 + 日志扫描。
      # 跑不到运行态就不出 IPA——产物发布前的强制闸门。
      - name: Smoke test on iOS Simulator
        run: bash scripts/smoke_test_simulator.sh

      - name: Upload smoke test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-test-evidence
          path: |
            .core-build/smoke/smoke_screenshot.png
            .core-build/smoke/smoke_launch.log
            .core-build/smoke/smoke_build.log
          if-no-files-found: warn

      - name: Build and fake-sign IPA
        run: bash build_trollstore_ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmi-trollstore
          path: clashmi-trollstore.ipa
          if-no-files-found: error

      # 打 v* 标签时自动发 Release，手机上直接从 Release 页下载
      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clashmi-trollstore.ipa
