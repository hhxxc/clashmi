name: Build TrollStore IPA

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'

      - name: Build Libclash core SDK
        run: bash scripts/build_libclash_core.sh

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install ldid
        run: brew install ldid

      - name: Build and fake-sign IPA
        run: bash build_trollstore_ipa.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashmi-trollstore
          path: clashmi-trollstore.ipa
          if-no-files-found: error

      # 打 v* 标签时自动发 Release，手机上直接从 Release 页下载
      - name: Create release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: clashmi-trollstore.ipa
